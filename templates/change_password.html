<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<style>

body{
    background:#0f172a;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{

    width:420px;
    background:#1e293b;
    padding:40px;
    border-radius:15px;

}

h2{

    text-align:center;
    color:#38bdf8;
    margin-bottom:25px;

}

input{

    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:none;
    border-radius:8px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    background:#38bdf8;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;

}

button:hover{

    background:#0ea5e9;

}

a{

    display:block;
    text-align:center;
    margin-top:20px;
    color:white;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="box">

<h2>🔒 Change Password</h2>

<form method="POST">

<input
type="password"
name="current_password"
placeholder="Current Password"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm New Password"
required>

<button type="submit">

Update Password

</button>

</form>

<a href="/dashboard">

⬅ Back to Dashboard

</a>

</div>

</body>

</html>
