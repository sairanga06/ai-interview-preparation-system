<!DOCTYPE html>
<html>

<head>

    <title>Edit Profile</title>

    <style>

        body{
            background:#0f172a;
            font-family:Arial;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            width:400px;
        }

        h2{
            text-align:center;
            color:#38bdf8;
            margin-bottom:25px;
        }

        input{

            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:none;
            border-radius:8px;
            font-size:16px;

        }

        button{

            width:100%;
            padding:12px;
            background:#38bdf8;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;

        }

        button:hover{

            background:#0ea5e9;

        }

        a{

            display:block;
            margin-top:20px;
            text-align:center;
            color:white;
            text-decoration:none;

        }

    </style>

</head>

<body>

<div class="box">

<h2>Edit Profile</h2>

<form method="POST">

<input
type="text"
name="username"
value="{{ user[0] }}"
required>

<input
type="email"
name="email"
value="{{ user[1] }}"
required>

<button type="submit">

Update Profile

</button>

</form>

<a href="/dashboard">

⬅ Back to Dashboard

</a>

</div>

</body>

</html>
